<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Minimal Solana desk for Christian Sanchez — Grok Bot, Scout, Trader, Guard." />
  <meta name="color-scheme" content="dark" />
  <title>Solana Desk · Christian Sanchez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141a24'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2314f195'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-title">
        <h1>Solana Desk</h1>
        <p>Christian Sanchez</p>
      </div>
      <p id="status-line" class="status-line" aria-live="polite">
        <span class="status-live">LIVE</span>
        <span class="sep">·</span>
        <span id="status-wallet">admin …</span>
        <span class="sep">·</span>
        <span id="status-pnl">PnL —</span>
      </p>
    </header>

    <!-- Desk floor: bots wander here -->
    <section class="desk-floor" id="desk-floor" aria-label="Bot desk floor">
      <div class="floor-grid" aria-hidden="true"></div>
      <div class="bots" id="bots"></div>
      <div id="bot-tooltip" class="bot-tooltip" hidden role="tooltip"></div>
    </section>

    <!-- Three simple cards -->
    <section class="cards" aria-label="Desk summary">
      <article class="card" id="card-wallet">
        <h2>Wallet</h2>
        <div class="card-body" id="wallet-body">
          <p class="muted">Loading…</p>
        </div>
      </article>
      <article class="card" id="card-pnl">
        <h2>PnL</h2>
        <div class="card-body" id="pnl-body">
          <p class="muted">Loading…</p>
        </div>
      </article>
      <article class="card" id="card-caps">
        <h2>Caps</h2>
        <div class="card-body" id="caps-body">
          <p class="muted">Loading…</p>
        </div>
      </article>
    </section>

    <!-- Minimal activity -->
    <section class="activity" aria-label="Recent activity">
      <h2>Activity</h2>
      <ul class="feed" id="activity-feed" aria-live="polite"></ul>
    </section>

    <footer class="footer">
      <span id="data-updated">—</span>
      <span>Display only · no keys · <code>data/activity.json</code></span>
    </footer>
  </div>
  <script src="js/app.js" defer></script>
</body>
</html>
